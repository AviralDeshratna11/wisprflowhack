[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swarlekhak"
version = "0.1.0"
description = "Voice-native academic accessibility assistant for Windows (Wispr Flow companion)"
requires-python = ">=3.11,<3.12"
readme = "README.md"
license = { text = "Proprietary - hackathon prototype" }
dependencies = [
  "PySide6==6.12.0",
  "numpy==2.4.6",
  "sounddevice==0.5.6",
  "vosk==0.3.45",
  "python-docx==1.2.0",
  "cryptography==50.0.2",
  "pywin32==312",
  "psutil==7.2.2",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "pytest-qt==4.5.0", "pyinstaller==6.22.3"]

[project.scripts]
swarlekhak = "swarlekhak.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "hardware: requires a real microphone / Windows audio stack",
  "model: requires the downloaded Vosk model",
]

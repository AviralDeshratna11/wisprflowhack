name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # Windows-only app: DPAPI, SAPI, SendInput and the PortAudio WASAPI stack are exercised on Windows.
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      PYTHONIOENCODING: utf-8
      QT_QPA_PLATFORM: offscreen
      SWARLEKHAK_DATA_DIR: ${{ github.workspace }}\ci-data
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock

      - name: Lint (syntax errors, undefined and unused names)
        run: |
          python -m pip install ruff==0.14.5
          python -m ruff check src scripts tests --select E9,F63,F7,F82,F401,F811,F841

      - name: Cache speech model
        uses: actions/cache@v4
        with:
          path: models/vosk-model-small-en-us-0.15
          key: vosk-${{ hashFiles('models/manifest.json') }}

      - name: Download + verify model (SHA-256 from models/manifest.json)
        run: python scripts/download_models.py

      - name: Tests (unit, integration, Qt e2e, accessibility audit)
        # CI uses labelled test doubles for Wispr Flow, microphone and TTS; live hardware/Flow need manual runs.
        run: python -m pytest -q -p no:cacheprovider --junitxml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml

  build-smoke:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -r requirements.lock
      - uses: actions/cache@v4
        with:
          path: models/vosk-model-small-en-us-0.15
          key: vosk-${{ hashFiles('models/manifest.json') }}
      - run: python scripts/download_models.py

      - name: PyInstaller one-folder build
        run: python -m PyInstaller --noconfirm --clean --distpath dist --workpath build installer/SwarLekhak.spec

      - name: Packaged self-test
        shell: pwsh
        run: |
          $env:SWARLEKHAK_DATA_DIR = "$env:GITHUB_WORKSPACE\selftest-data"
          $p = Start-Process -FilePath dist\SwarLekhak\SwarLekhak.exe -ArgumentList "--selftest" -Wait -PassThru
          Get-Content "$env:SWARLEKHAK_DATA_DIR\logs\selftest.json"
          if ($p.ExitCode -ne 0) { throw "packaged self-test failed ($($p.ExitCode))" }

      - name: Upload self-test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packaged-selftest
          path: selftest-data/logs/selftest.json
